[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-stereo-recognition"
version = "0.1.0"
description = "Contract-driven dual-camera ASL recognition pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.11,<2.0",
    "pandas>=2.1,<3.0",
    "h5py>=3.10,<4.0",
    "tqdm>=4.65,<5.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
runtime = [
    "mediapipe==0.10.21",
    "protobuf==4.25.3",
    "opencv-python>=4.8,<5",
    "PyQt5>=5.15,<6",
    "torch==2.3.0",
]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
